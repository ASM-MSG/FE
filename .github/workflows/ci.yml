name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# 같은 PR/브랜치에 연속 push 시 이전 실행 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 버전은 루트 package.json의 packageManager 필드가 단일 출처 — version 입력 생략
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # CI 환경에서는 pnpm이 자동으로 frozen-lockfile 모드로 동작하지만 명시성을 위해 지정
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

  # optional 게이트 — 안정성 확인 전까지 continue-on-error로 PR 머지를 막지 않는다.
  # 안정화되면 continue-on-error 줄을 제거해 필수 게이트로 승격한다.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit — 브라우저 바이너리만 캐시되고 apt 의존성은 캐시 경로 밖이라 매번 필요)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      # NOTE: pull_request 이벤트는 포크에서 열린 PR에 리포지토리 Secret을 노출하지 않는 게
      # GitHub Actions 기본 동작이다 (보안 목적). 그 경우 VITE_NAVER_MAP_NCP_KEY_ID가 빈 값이 되어
      # 네이버 지도 SDK 로딩이 실패하고 이 job은 항상 실패한다. 지금은 continue-on-error라 머지를
      # 막지 않지만, 이 job을 필수 게이트로 승격하기 전에는 반드시 재확인할 것 — 사내 기여자만
      # PR을 연다면 문제없으나(이 레포는 Private), 외부 포크 PR이 생기는 시점에 재발 가능.
      - name: E2E Test
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          VITE_NAVER_MAP_NCP_KEY_ID: ${{ secrets.VITE_NAVER_MAP_NCP_KEY_ID }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
